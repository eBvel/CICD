[tool.poetry]
name = "poetry-practice"
version = "0.1.0"
description = ""
authors = ["eBvel <belyakov041098@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.34.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.15"
mypy = "^2.1.0"
bandit = {extras = ["toml"], version = "^1.9.4"}
pre-commit = "^4.6.0"
pytest = "^9.0.3"

[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"


[tool.poetry.group.checking.dependencies]
ruff = "^0.15.20"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
exclude = [
	".venv",
	".idea"
]
line-length = 80
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
	"E", # pycodestyle errors
	"W", # pycodestyle warnings
	"F", # pyflakes
	"I", # isort
	"C90", # mccabe
	"PL", # pylint
    "N", # PEP-8 Naming
    "SIM", # flake8-simplify
	"ARG"
]
ignore = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 72

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
	".venv.*",
	".idea.*",
	"tests.*"
]

[[tool.mypy.overrides]]
module = "app.*"
ignore_errors = true

[tool.bandit]
exclude_dirs = [".venv",".idea", "tests"]
tests = ["B101", "B102", "B110", "B113", "B501", "B605", "B613"]