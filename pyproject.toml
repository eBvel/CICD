[tool.poetry]
name = "poetry-practice"
version = "0.1.0"
description = ""
authors = ["eBvel <belyakov041098@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.34.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
exclude = [
	".venv",
	".idea"
]
line-length = 80
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
	"E", # pycodestyle errors
	"W", # pycodestyle warnings
	"F", # pyflakes
	"I", # isort
	"C90", # mccabe
	"PL", # pylint
    "N", # PEP-8 Naming
    "SIM" # flake8-simplify
]
ignore-init-module-imports = false
unfixable = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 72

[tool.ruff.lint.isort]
force-sort-within-sections = true